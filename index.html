<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoSort: River Cleanup</title>
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    canvas {
      background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
      border: 3px solid #38bdf8;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .hud {
      width: 400px;
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-weight: bold;
      font-size: 1.1rem;
    }
    p { color: #94a3b8; font-size: 0.9rem; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="hud">
    <span>♻️ Score: <span id="score">0</span></span>
    <span>❤️ Lives: <span id="lives">3</span></span>
  </div>
  <canvas id="game" width="400" height="550"></canvas>
  <p>Use <strong>Left / Right Arrows</strong> or <strong>A / D</strong> to collect trash (🧴) and avoid fish (🐟).</p>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const livesEl = document.getElementById("lives");

    let score = 0;
    let lives = 3;
    let gameOver = false;

    const player = { x: 170, y: 490, width: 60, height: 20, speed: 6 };
    const items = [];
    const keys = {};

    window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
    window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

    function spawnItem() {
      if (gameOver) return;
      const isTrash = Math.random() < 0.7;
      items.push({
        x: Math.random() * (canvas.width - 30),
        y: -30,
        size: 26,
        speed: 2.5 + Math.random() * 2 + score * 0.05,
        type: isTrash ? "trash" : "fish",
        emoji: isTrash ? ["🧴", "🥤", "🛍️"][Math.floor(Math.random() * 3)] : "🐟"
      });
    }

    function update() {
      if (gameOver) return;

      if ((keys["arrowleft"] || keys["a"]) && player.x > 0) player.x -= player.speed;
      if ((keys["arrowright"] || keys["d"]) && player.x < canvas.width - player.width) player.x += player.speed;

      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        item.y += item.speed;

        // Collision check
        if (
          item.x < player.x + player.width &&
          item.x + item.size > player.x &&
          item.y < player.y + player.height &&
          item.y + item.size > player.y
        ) {
          if (item.type === "trash") {
            score += 10;
            scoreEl.textContent = score;
          } else {
            lives--;
            livesEl.textContent = lives;
          }
          items.splice(i, 1);
          continue;
        }

        // Missed trash penalty
        if (item.y > canvas.height) {
          if (item.type === "trash") {
            lives--;
            livesEl.textContent = lives;
          }
          items.splice(i, 1);
        }
      }

      if (lives <= 0) gameOver = true;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Boat
      ctx.fillStyle = "#facc15";
      ctx.fillRect(player.x, player.y, player.width, player.height);
      ctx.fillStyle = "#854d0e";
      ctx.fillRect(player.x + 10, player.y - 8, player.width - 20, 8);

      // Draw Items
      ctx.font = "24px serif";
      items.forEach(item => ctx.fillText(item.emoji, item.x, item.y + 22));

      if (gameOver) {
        ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 28px system-ui";
        ctx.textAlign = "center";
        ctx.fillText("River Polluted!", canvas.width / 2, 240);
        ctx.font = "18px system-ui";
        ctx.fillText(`Final Score: ${score}`, canvas.width / 2, 280);
        ctx.fillText("Refresh page to play again", canvas.width / 2, 320);
      }
    }

    setInterval(spawnItem, 900);
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
